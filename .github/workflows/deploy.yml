name: Deploy to PythonAnywhere

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.pythonanywhere.com
          username: ${{ secrets.PA_USER }}
          key: ${{ secrets.PA_SSH_KEY }}
          script: |
            cd /home/${{ secrets.PA_USER }}/CarbonCoach
            git pull
            touch /var/www/${{ secrets.PA_USER }}_pythonanywhere_com/reload
