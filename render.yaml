services:
  - type: web
    name: carboncoach
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GRID_FACTOR_KG_CO2_PER_KWH
        value: "0.71"
